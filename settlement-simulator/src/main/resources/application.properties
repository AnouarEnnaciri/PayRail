spring.application.name=payrail-settlement-simulator
server.port=8081
spring.datasource.url=${SIMULATOR_DB_URL:jdbc:postgresql://localhost:5434/payrail_simulator}
spring.datasource.username=${SIMULATOR_DB_USER}
spring.datasource.password=${SIMULATOR_DB_PASSWORD}
spring.flyway.enabled=true
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
# Must exceed the PayRail HTTP client read timeout when testing lost responses.
simulator.timeout-delay-ms=3000
# The timestamp is persisted, allowing delayed completion after simulator restart.
simulator.settlement-delay-ms=3000
