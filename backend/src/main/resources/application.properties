spring.application.name=payrail-backend

spring.datasource.url=jdbc:postgresql://localhost:5433/${PAYRAIL_DB_NAME}
spring.datasource.username=${PAYRAIL_DB_USER}
spring.datasource.password=${PAYRAIL_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,metrics
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# M15: JSON output includes sanitized MDC keys, without additional dependencies.
logging.structured.format.console=logstash